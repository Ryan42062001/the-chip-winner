name: TCW-047 one-time original mechanical readiness preflight

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/tcw-047-original-mechanical-preflight.yml

permissions:
  contents: read
  pull-requests: read

jobs:
  original-mechanical-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact triggering canonical Manager commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: manager
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout immutable repaired Builder candidate without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: 7c5bd1add860d1e8ed7bc03717451c7d88a21c50
          path: builder
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare Node and retained preflight evidence
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify exact canonical and Builder revisions before running original helper
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          test "$GITHUB_REF" = "refs/heads/master"
          test "$(git -C manager rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C builder rev-parse HEAD)" = "7c5bd1add860d1e8ed7bc03717451c7d88a21c50"
          test -z "$(git -C builder status --porcelain)"
          git -C builder checkout -q -B builder/tcw-047-automated-audit-readiness "7c5bd1add860d1e8ed7bc03717451c7d88a21c50"
          git -C builder merge-base --is-ancestor "7ca2953009d37a014e041cc24f4934bfe61b5cad" "7c5bd1add860d1e8ed7bc03717451c7d88a21c50"
          test "$(git -C builder branch --show-current)" = "builder/tcw-047-automated-audit-readiness"
          printf 'canonicalManagerSha=%s\nbuilderCandidateSha=%s\nauthorizedBuilderCreationBaseline=%s\n' "$GITHUB_SHA" "7c5bd1add860d1e8ed7bc03717451c7d88a21c50" "7ca2953009d37a014e041cc24f4934bfe61b5cad" > evidence/provenance.txt

      - name: Verify read-only GitHub PR identity before original helper
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/Ryan42062001/the-chip-winner/pulls/162" > evidence/pr-before.json
          node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync("evidence/pr-before.json","utf8")); if(p.state!=="open" || p.draft!==true || p.head.sha!=="7c5bd1add860d1e8ed7bc03717451c7d88a21c50" || p.head.ref!=="builder/tcw-047-automated-audit-readiness" || p.head.repo.full_name!=="Ryan42062001/the-chip-winner" || p.base.ref!=="master") process.exit(2);'

      - name: Overlay only exact canonical Manager control-plane, without altering Builder HEAD
        shell: bash
        run: |
          set -euo pipefail
          cp -a manager/.ai/. builder/.ai/
          test "$(git -C builder rev-parse HEAD)" = "7c5bd1add860d1e8ed7bc03717451c7d88a21c50"
          test "$(git -C builder branch --show-current)" = "builder/tcw-047-automated-audit-readiness"
          git -C builder status --porcelain > evidence/overlay-status.txt
          if grep -v -E '^.. \.ai/' evidence/overlay-status.txt | grep .; then
            echo "Unexpected non-control-plane checkout modification" >&2
            exit 2
          fi

      - name: Run ORIGINAL task-specific npm mechanical helper, retain unmodified JSON packet
        working-directory: builder
        shell: bash
        env:
          npm_config_ignore_scripts: "true"
        run: |
          set -euo pipefail
          npm run --silent workflow:audit-readiness -- --task TCW-047 > ../evidence/original-packet.json 2> ../evidence/original-stderr.log

      - name: Independently check original helper packet SHA256, provenance, blockers and scope
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import crypto from "node:crypto";
          const packet=JSON.parse(fs.readFileSync("evidence/original-packet.json","utf8"));
          const {sha256,...payload}=packet;
          const actual=crypto.createHash("sha256").update(JSON.stringify(payload)).digest("hex");
          const expected=[".ai/builder/TCW-047_HANDOFF.md",".github/workflows/task-audit-readiness.yml","scripts/workflow-audit-readiness-automation.js","test/workflow-audit-readiness-automation.test.js"];
          const registry=JSON.parse(fs.readFileSync("manager/.ai/shared/ACTIVE_TASKS.json","utf8"));
          const task=registry.tasks.find(t=>t.task_id==="TCW-047");
          if(sha256!==actual || packet.schema!=="TCW_AUDIT_READINESS_V1" ||
            packet.taskId!=="TCW-047" || packet.branch!=="builder/tcw-047-automated-audit-readiness" ||
            packet.head!=="7c5bd1add860d1e8ed7bc03717451c7d88a21c50" || packet.assignmentMasterSha!=="7ca2953009d37a014e041cc24f4934bfe61b5cad" ||
            packet.pr!==162 || packet.auditRequired!==true || packet.readyForManagerFreeze!==true ||
            !Array.isArray(packet.blockers) || packet.blockers.length!==0 ||
            JSON.stringify(packet.changedFiles)!==JSON.stringify(expected) ||
            task?.worker_checkpoint_sha!=="7c5bd1add860d1e8ed7bc03717451c7d88a21c50" || task?.status!=="MANAGER_REVIEW_READY" ||
            task?.assignment_master_sha!=="7ca2953009d37a014e041cc24f4934bfe61b5cad" ||
            task?.audit_target_sha!=="acb63b0c85b98b34fac9af99f00f38553de5670c") {
              console.error("Original helper packet or canonical checkpoint contract mismatch");
              process.exit(2);
          }
          const evidence={classification:"PASS",canonicalManagerSha:process.env.GITHUB_SHA,checkedBuilderSha:packet.head,originalPacketSha256:sha256,changedFiles:packet.changedFiles,blockers:packet.blockers,readyForManagerFreeze:packet.readyForManagerFreeze,originalHelperOnly:true};
          fs.writeFileSync("evidence/verified-original-preflight.json",JSON.stringify(evidence,null,2)+"\n");
          console.log("ORIGINAL TASK-SPECIFIC MECHANICAL READINESS PASS; packet SHA256="+sha256);
          NODE

      - name: Verify unchanged exact Builder PR head after original helper
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/Ryan42062001/the-chip-winner/pulls/162" > evidence/pr-after.json
          node --input-type=module -e 'import fs from "node:fs"; const a=JSON.parse(fs.readFileSync("evidence/pr-after.json","utf8")); const b=JSON.parse(fs.readFileSync("evidence/pr-before.json","utf8")); if(a.state!=="open"||a.draft!==true||a.head.sha!=="7c5bd1add860d1e8ed7bc03717451c7d88a21c50"||a.head.sha!==b.head.sha||a.base.ref!=="master") process.exit(2);'
          test "$(git -C builder rev-parse HEAD)" = "7c5bd1add860d1e8ed7bc03717451c7d88a21c50"

      - name: Upload original mechanical readiness and negative-path artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tcw-047-original-manual-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 14
