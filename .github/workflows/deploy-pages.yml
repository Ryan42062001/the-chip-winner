name: Deploy website

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY to publish canonical master to GitHub Pages
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  validate:
    if: inputs.confirm == 'DEPLOY'
    runs-on: ubuntu-latest
    outputs:
      master_sha: ${{ steps.sha.outputs.value }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Record canonical master SHA
        id: sha
        run: echo "value=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Validate workflow contract
        run: python3 .github/scripts/validate_phase_workflow.py
      - run: npm ci
      - run: npm run check:full
      - run: npm audit --audit-level=high

  deploy:
    if: inputs.confirm == 'DEPLOY'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.master_sha }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  verify-production:
    if: inputs.confirm == 'DEPLOY'
    needs: [validate, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.master_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm run smoke:production
